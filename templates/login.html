<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MOD-X Hosting</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Poppins', sans-serif; background: #060b16; display:flex; justify-content:center; align-items:center; height:100vh; }
        .login-box { background: #0d1424; padding: 50px; border-radius: 30px; border:1px solid rgba(70,120,255,.15); width: 400px; text-align:center; box-shadow:0 0 40px rgba(0,100,255,.1); }
        .logo { font-size:50px; color:#3f89ff; margin-bottom:20px; }
        h2 { color:white; font-size:28px; margin-bottom:5px; }
        p { color:#95a4d4; margin-bottom:30px; }
        input { width:100%; padding:18px; border-radius:16px; border:1px solid rgba(255,255,255,.08); background:#060b16; color:white; font-size:16px; outline:none; transition:.3s; }
        input:focus { border-color:#3f89ff; }
        button { width:100%; padding:18px; border:none; border-radius:16px; background:linear-gradient(135deg,#2662ff,#0055ff); color:white; font-size:18px; font-weight:700; margin-top:20px; cursor:pointer; transition:.3s; }
        button:hover { transform:scale(1.02); box-shadow:0 0 20px rgba(38,98,255,.5); }
        .error { color:#ff5a76; margin-top:15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <h2>Welcome Back</h2>
        <p>Enter your access code</p>
        <form method="POST">
            <input type="password" name="code" placeholder="Enter Secret Code" required>
            <button type="submit"><i class="fa-solid fa-lock-open"></i> &nbsp; Login</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </div>
</body>
</html>
